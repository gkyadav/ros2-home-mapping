slam_toolbox:
  ros__parameters:

    # Frames
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan

    # Mode
    mode: mapping   # we are building a map

    # TF publishing
    transform_publish_period: 0.05
    map_update_interval: 2.0

    # Basic scan matcher settings (defaults are usually fine)
    use_scan_matching: true
    use_scan_barycenter: true
    resolution: 0.05
    max_laser_range: 10.0

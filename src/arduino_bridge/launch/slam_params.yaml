slam_toolbox:
  ros__parameters:

    # --- General ---
    use_sim_time: false
    use_lifecycle: true          # ✅ so you don't need lifecycle commands

    # --- Frames / topics (match your robot) ---
    odom_frame: "odom"
    map_frame: "map"
    base_frame: "base_link"       # change if your robot uses base_footprint etc.
    scan_topic: "/scan"
    mode: "mapping"               # "mapping" or "localization"

    # --- Solver (Ceres) ---
    solver_plugin: "solver_plugins::CeresSolver"
    ceres_linear_solver: "SPARSE_NORMAL_CHOLESKY"
    ceres_preconditioner: "SCHUR_JACOBI"
    ceres_trust_strategy: "LEVENBERG_MARQUARDT"
    ceres_dogleg_type: "TRADITIONAL_DOGLEG"
    ceres_loss_function: "None"

    # --- Map / grid settings ---
    resolution: 0.05              # 5 cm grid
    max_laser_range: 10.0         # m
    minimum_time_interval: 0.5    # s between processed scans
    transform_timeout: 0.2        # TF wait time
    tf_buffer_duration: 30.0      # TF buffer size
    stack_size_to_use: 40000000   # for Ceres

    # --- Scan matcher / motion thresholds ---
    minimum_travel_distance: 0.1   # m
    minimum_travel_heading: 0.1    # rad
    scan_queue_size: 5

    # --- Loop closure / optimization ---
    use_scan_matching: true
    use_scan_barycenter: false
    optimization_frequency: 0.5
    constraint_search_radius: 8.0
    minimum_constraint_score: 0.1
    max_laser_range_no_pose: 8.0

    # --- Debug / RViz plugin options ---
    enable_interactive_mode: false
    debug_logging: false

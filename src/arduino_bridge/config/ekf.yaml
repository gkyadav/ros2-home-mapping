ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.1

    two_d_mode: true
    publish_tf: true

    map_frame: "map"
    odom_frame: "odom"
    base_link_frame: "base_link"
    world_frame: "odom"

    # -----------------------
    # IMU – using /imu/data_raw
    # -----------------------
    imu0: "imu/data_raw"
    imu0_config: [
      false, false, false,
      false, false, true,
      false, false, false,
      true,  true,  true,
      true,  true,  true
    ]
    imu0_differential: false
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true

    # -----------------------
    # ODOM – using /odom_raw
    # -----------------------
    odom0: "odom_raw"
    odom0_config: [
      true,  true,  false,
      false, false, true,
      true,  true,  false,
      false, false, false,
      false, false, false
    ]
    odom0_differential: false
    odom0_queue_size: 10

    debug: false
    print_diagnostics: true
    dynamic_process_noise_covariance: false

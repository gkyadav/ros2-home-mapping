amcl:  # kept for completeness; SLAM is really providing map->odom
  ros__parameters:
    use_sim_time: false

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_frame: odom
    default_bt_xml_filename: "navigate_w_replanning_and_recovery.xml"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_plugins: ["FollowPath"]

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false

      # === YOUR ROBOT LIMITS ===
      min_vel_x: 0.0
      max_vel_x: 0.10          # max linear speed (m/s)
      min_vel_y: 0.0           # differential drive, no lateral motion
      max_vel_y: 0.0

      max_vel_theta: 1.0       # max angular speed (rad/s)
      min_vel_theta: 0.0

      acc_lim_x: 0.20          # conservative accel (m/s^2)
      decel_lim_x: -0.20
      acc_lim_theta: 0.8       # angular accel limit
      decel_lim_theta: -0.8

      vx_samples: 8            # fewer samples = lighter CPU, smoother
      vtheta_samples: 20

      xy_goal_tolerance: 0.05  # 5 cm
      yaw_goal_tolerance: 0.10 # ~6 degrees
      trans_stopped_velocity: 0.01
      rot_stopped_velocity: 0.05

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.1
      use_astar: true
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["SimpleSmoother"]

    SimpleSmoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link

waypoint_follower:
  ros__parameters:
    use_sim_time: false

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: true
    feedback: "OPEN_LOOP"
    # [vx, vy, vtheta]
    max_velocity: [0.10, 0.0, 1.0]
    min_velocity: [0.0, 0.0, 0.0]
    # you can tune these further if needed:
    # acceleration_limits: [0.2, 0.0, 0.8]
    # deceleration_limits: [0.2, 0.0, 0.8]

costmap_common_params:
  ros__parameters:
    obstacle_layer:
      plugin: "nav2_costmap_2d::ObstacleLayer"
      observation_sources: scan
      scan:
        topic: scan
        max_obstacle_height: 0.50
        clearing: true
        marking: true
        data_type: "LaserScan"
        obstacle_range: 4.0
        raytrace_range: 5.0

    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      inflation_radius: 0.35        # ~0.16 robot radius + 0.2 safety

    static_layer:
      plugin: "nav2_costmap_2d::StaticLayer"

global_costmap:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    use_sim_time: false
    rolling_window: false
    width: 20.0
    height: 20.0
    resolution: 0.05
    robot_radius: 0.16              # your robot radius
    plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

local_costmap:
  ros__parameters:
    global_frame: odom
    robot_base_frame: base_link
    use_sim_time: false
    rolling_window: true
    width: 5.0
    height: 5.0
    resolution: 0.05
    robot_radius: 0.16              # your robot radius
    plugins: ["obstacle_layer", "inflation_layer"]
